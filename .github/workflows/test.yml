name: Test Agent Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run workflow tests
        run: python -m unittest discover -s skills/daoist-video-skill/tests -v
      - name: Compile Python modules
        run: python -m py_compile skills/daoist-video-skill/pipeline.py

